<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score Keeper!</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <figure><img
                src="C:\Users\shlok\OneDrive\Desktop\WebDev\Score Keeper Project\lisa-keffer-3B8nIiT-Pmc-unsplash.jpg"
                alt="Picture of 2 ping pong rackets!"></figure>
        <header>
            <h2>Ping Pong Score Keeper</h2>
        </header>
        <section>
            <h1>0 to 0</h1>
            <p>Use the button below to keep score</p>
            <label for="play-upto">Playing to</label>
            <select name="score_max" id="play-upto">
                <option value="7">7</option>
                <option value="11">11</option>
                <option value="21">21</option>
            </select>
            <div><button>+1 Player One</button>
                <button>+1 Player Two</button>
                <button>Reset</button>
            </div>
        </section>
    </main>
    <script src="app.js"></script>
</body>

</html>
