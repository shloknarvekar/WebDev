<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>

<body>
    <h1>Forms Demo</h1>
    <form action="/tacos">
        <p><label for="username">Enter username: </label>
            <input id="username" type="text" placeholder="username" name="username">
        </p>
        <p> <label for="password">Enter a password: </label>
            <input id="password" type="password" placeholder="password" name="password">
        </p>
        <p><label for="colour">Enter a colour: </label>
            <input id="colour" type="color" name="colour">
        </p>
        <p><label for="num">Enter a number: </label>
            <input id="num" type="number" placeholder="enter a number" name="number">
        </p>
        <button>Submit</button>
    </form>
    <h2>Hijacking Searches</h2>
    <form action="https://www.reddit.com/search/">
        <h3>Hijacking Reddit</h3>
        <input type="text" name="q">
        <button>Search Reddit</button>
    </form>
    <form action="https://www.google.com/search">
        <h3>Hijacking Google</h3>
        <input type="text" name="q">
        <button>Search Google</button>
    </form>
    <form action="https://www.youtube.com/results">
        <h3>Hijacking Youtube</h3>
        <input type="text" name="search_query">
        <button>Search Youtube</button>
    </form>
    <h2>More Inputs!</h2>
    <form action="/birds">
        <input type="checkbox" name="agree_tos" id="agree" checked>
        <label for="agree">I agree to everything</label>
        <p>
            <label for="xs">XS</label>
            <input type="radio" name="size" id="xs" value="xs">
            <label for="s">S</label>
            <input type="radio" name="size" id="s" value="s">
            <label for="m">M</label>
            <input type="radio" name="size" id="m" value="m">
        </p>
        <p>
            <label for="meal">Please Select an Entree</label>
            <select name="meal" id="meal">
                <option value="fish">Fish</option>
                <option value="veg">Vegetarian</option>
                <option value="chckn">Chicken</option>
            </select>
        </p>
        <p> <label for="cheese">Amount of Cheese???</label>
            <input type="range" id="cheese" min="0" max="100" name="cheese_level" step="10" value="75">
        </p>
        <p>
            <label for="extra">Any Special Requests?</label>
            <br>
            <textarea id="extra" rows="10" name="extra" cols="50" placeholder="Enter here"></textarea>

        </p>
        <button>Submit</button>

    </form>
    <h2>Validation Demo</h2>
    <form action="/dummy">
        <label for="first">Enter First Name</label>
        <input type="text" id="first" name="first" required>
        <p>
            <label for="username">Entere username</label>
            <input type="text" id="username" name="username" minlength="3" maxlength="15" required>

        </p>
        <p>
            <label for="email">Email</label>
            <input id="email" type="email" name="email" required>
        </p>
        <p>
            <label for="url">Enter url</label>
            <input id="url" type="url" name="url" required>
        </p>
        <button>Submit</button>
    </form>
</body>

</html>
